# =============================================================================
# ConsultAI
# =============================================================================
#   1. cp .env.example .env   puis remplissez sa PARTIE 1 (voir ses commentaires)
#   2. docker compose up -d
#
# L'image est publiée sur GitHub Container Registry : rien à construire.
# Toute la configuration vit dans .env — ce fichier-ci n'a presque rien à
# toucher. Détails utiles :
#   • Authentification OIDC, gérée par l'application elle-même. Un reverse
#     proxy HTTPS devant ce conteneur est requis, mais en simple relais : sa
#     propre authentification doit rester désactivée (README §4).
#   • [SYNOLOGY] seul réglage propre à ce NAS : "user:" ci-dessous.
# =============================================================================

services:
  consultai:
    image: ghcr.io/varialflip/consultai:latest
    container_name: consultai
    restart: unless-stopped
    env_file: .env

    # [SYNOLOGY] Fait tourner le conteneur sous l'UID/GID propriétaire de
    # ./data (voir APP_UID/APP_GID dans .env) plutôt que le défaut de l'image
    # — les ACL Synology l'exigent. Ailleurs, 1000:1000 convient tel quel.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"

    # Voir BIND_ADDRESS/BIND_PORT dans .env : c'est le rempart réseau
    # principal, à compléter par une règle de pare-feu (README §4).
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8787}:8000"

    # Les deux seuls dossiers qui survivent au conteneur. Format d'une ligne :
    #   <chemin sur l'hôte>:<chemin dans le conteneur>[:ro]
    # Ne changez que la partie GAUCHE : la partie droite est celle qu'attend
    # l'application (DATABASE_URL, AUDIO_DIR, DICTATION_DIR,
    # GOOGLE_APPLICATION_CREDENTIALS dans .env pointent vers elle).
    #
    # `./data` est relatif au dossier de CE fichier. Pour ranger les données
    # ailleurs — autre volume, disque plus grand, partage chiffré — mettez un
    # chemin absolu :
    #     - /volume2/chiffre/consultai:/data
    #
    # ⚠️ Créez le dossier hôte AVANT le premier `up`. Docker le crée sinon
    # lui-même, mais appartenant à root : le conteneur, qui tourne sous
    # APP_UID:APP_GID (voir `user:` plus haut), ne pourra pas y écrire et
    # s'arrêtera sur `unable to open database file`.
    #     mkdir -p /volume2/chiffre/consultai
    #     chown "$APP_UID:$APP_GID" /volume2/chiffre/consultai
    #
    # Pour ne déplacer QUE l'audio (le plus volumineux, et le plus sensible —
    # README § 11), ajoutez un montage imbriqué sous /data ; il faut qu'il
    # concorde avec AUDIO_DIR du .env :
    #     - /volume2/chiffre/audio:/data/audio
    #
    # DÉVELOPPEMENT — voir son propre code sans reconstruire l'image. Le code
    # vit dans /app/app ; ce montage le recouvre par celui du dépôt cloné :
    #     - ./app:/app/app
    # `docker compose restart consultai` suffit alors à recharger (et un
    # rafraîchissement forcé du navigateur pour les fichiers de app/static/).
    # À RETIRER en production : l'image redeviendrait sinon dépendante d'un
    # dossier de l'hôte, et une mise à jour par `pull` n'aurait plus d'effet.
    volumes:
      - ./data:/data           # base SQLite, audio, dictées en cours
      # `:ro` = lecture seule. Le conteneur n'a aucune raison d'écrire ici :
      # gardez-le. Omettez cette ligne entière si vous n'utilisez pas Google.
      - ./secrets:/secrets:ro  # clé de service Google Cloud, si utilisée
      - ./app:/app/app         # DEV : code source local (retirer en prod)

    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Alternative aux montages ci-dessus : un volume nommé, rangé par Docker dans
# ses propres dossiers. Il esquive les ACL Synology, mais les données ne sont
# plus visibles depuis File Station ni prises par Hyper Backup (README § 9) —
# d'où le montage sur ./data par défaut. Si vous y tenez : remplacez la ligne
# `- ./data:/data` par `- consultai-data:/data`, puis décommentez :
# volumes:
#   consultai-data:

# Pour rejoindre le réseau Docker d'un reverse proxy existant (ex. Pangolin) :
# ajoutez `networks: [proxy]` au service ci-dessus, puis décommentez :
# networks:
#   proxy:
#     external: true
