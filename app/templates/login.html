<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('auth.welcome_title') }}</title>
<style>
 body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0f172a;color:#e2e8f0;
      display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:1.5rem}
 .card{max-width:26rem;width:100%;background:#1e293b;border:1px solid #334155;border-radius:.75rem;padding:2rem}
 h1{margin:0 0 .5rem;font-size:1.35rem;color:#f1f5f9;text-align:center}
 p.sub{margin:0 0 1.5rem;text-align:center;font-size:.85rem;color:#94a3b8;line-height:1.5}
 label.stay{display:flex;gap:.7rem;align-items:flex-start;padding:.9rem;border:1px solid #334155;
            border-radius:.5rem;background:#0f172a;cursor:pointer;margin-bottom:1.25rem}
 label.stay:hover{border-color:#475569}
 label.stay input{margin-top:.15rem;width:1.1rem;height:1.1rem;accent-color:#5eead4;cursor:pointer}
 label.stay .txt b{display:block;font-size:.92rem;color:#e2e8f0}
 label.stay .txt span{display:block;font-size:.78rem;color:#94a3b8;margin-top:.2rem;line-height:1.4}
 button{width:100%;border:0;border-radius:.5rem;padding:.85rem 1rem;background:#5eead4;color:#0f172a;
        font-weight:700;font-size:.95rem;cursor:pointer}
 button:hover{background:#99f6e4}
 p.note{margin:1rem 0 0;text-align:center;font-size:.75rem;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>{{ t('auth.welcome_title') }}</h1>
  <p class="sub">{{ t('auth.welcome_subtitle', sso=sso_name) }}</p>
  <form method="post" action="/auth/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="stay">
      <input type="checkbox" name="stay_logged_in" value="true">
      <span class="txt">
        <b>{{ t('auth.stay_logged_in', jours=stay_days) }}</b>
        <span>{{ t('auth.stay_logged_in_hint') }}</span>
      </span>
    </label>
    <button type="submit">{{ t('auth.sign_in_with', sso=sso_name) }}</button>
  </form>
  <p class="note">{{ t('auth.session_note', heures=default_hours) }}</p>
</div>
</body>
</html>
