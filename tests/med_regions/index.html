<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConsultAI — Annotation régions médicaments + Qwen</title>
<style>
:root{--bg:#0d1117;--fg:#c9d1d9;--dim:#8b949e;--border:#30363d;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--orange:#db6d28;--bg2:#161b22;--bg3:#1c2128;--bg4:#21262d;--region-bg:#1a3a1a;--user-region:#1a3a5c;--qwen-bg:#2a1a3a;--over-detect:#3d1a1a;--under-detect:#3d2e1a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'SF Mono','Cascadia Code','Consolas',monospace;background:var(--bg);color:var(--fg);font-size:13px;line-height:1.5}
.container{max-width:1500px;margin:0 auto;padding:16px}
.header{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px 24px;margin-bottom:16px}
.header h1{font-size:18px;color:var(--accent);margin-bottom:4px}
.header .subtitle{color:var(--dim);font-size:12px}
.export-bar{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;align-items:center}
.btn{background:var(--bg3);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-family:inherit;font-size:12px;cursor:pointer}
.btn:hover{background:var(--bg4);border-color:var(--accent)}
.btn-primary{background:#1f3d5c;border-color:var(--accent);color:var(--accent)}
.btn-reset{background:#3d1a1a;border-color:var(--red);color:var(--red)}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:600}
.badge-det{background:#1f3d5c;color:var(--accent)}
.badge-phon{background:#3d2e1f;color:var(--orange)}
.badge-qwen{background:#2a1a3a;color:#c084fc}
.badge-annotated{background:#1a3a1a;color:var(--green)}
.badge-pending{background:#3d2e1a;color:var(--yellow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0}
.stat-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.stat-card .stat-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px}
.stat-card .stat-value{font-size:20px;font-weight:700;margin-top:2px}
table.summary{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
table.summary th{background:var(--bg3);color:var(--accent);text-align:left;padding:8px 10px;border:1px solid var(--border);cursor:pointer}
table.summary th:hover{background:var(--bg4)}
table.summary td{padding:6px 10px;border:1px solid var(--border)}
table.summary tr:hover{background:var(--bg2);cursor:pointer}
.consult{background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin:16px 0;overflow:hidden}
.consult-header{padding:14px 20px;background:var(--bg3);border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.consult-header:hover{background:var(--bg4)}
.consult-header h2{font-size:14px;display:inline;margin-left:8px}
.consult-header .meta{color:var(--dim);font-size:11px}
.consult-body{display:none}
.consult.open .consult-body{display:block}
.consult.open .chevron{transform:rotate(90deg)}
.chevron{transition:transform 0.15s;color:var(--dim)}
.section{padding:14px 20px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none}
.section-title{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
table.items-table{width:100%;border-collapse:collapse;font-size:11px}
table.items-table th{background:var(--bg4);color:var(--dim);text-align:left;padding:5px 8px;border:1px solid var(--border)}
table.items-table td{padding:4px 8px;border:1px solid var(--border)}
table.items-table tr.phonetic{background:#1a1a2e}
.garble{color:var(--yellow);font-style:italic}
.inline-list{display:flex;gap:6px;flex-wrap:wrap}
.inline-tag{background:#1f3d5c;color:var(--accent);padding:2px 8px;border-radius:4px;font-size:11px}
.region-block{margin:14px 20px;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.region-block.annotated{border-color:var(--green)}
.region-block-header{padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.region-block-header .label{font-size:12px;font-weight:600}
.region-text{padding:12px 14px;font-size:12px;line-height:2}
.region-text .ctx{color:var(--dim)}
.region-text .med-det{background:var(--region-bg);color:var(--green);padding:1px 3px;border-radius:2px;font-weight:600}
.region-text .med-both{background:#1a3a2e;color:#7ee787;padding:1px 3px;border-radius:2px;font-weight:600;border-bottom:2px solid var(--green)}
.region-text .over-det{background:var(--over-detect);color:var(--red);padding:1px 3px;border-radius:2px;text-decoration:line-through}
.region-text .under-det{background:var(--under-detect);color:var(--orange);padding:1px 3px;border-radius:2px;border-bottom:2px solid var(--orange)}
.annotation-bar{padding:10px 14px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.annotation-bar .label{font-size:11px;color:var(--dim)}
.marker{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.marker-start{background:#1a3a1a;color:var(--green);border:1px solid var(--green)}
.marker-end{background:#3d1a1a;color:var(--red);border:1px solid var(--red)}
.marker-none{background:var(--bg4);color:var(--dim)}
.annotation-note{flex:1;min-width:200px}
.annotation-note input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-family:inherit;font-size:11px}
.annotation-note input:focus{border-color:var(--accent);outline:none}
.legend{padding:10px 14px;background:var(--bg3);border-top:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap;font-size:10px}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-swatch{width:14px;height:14px;border-radius:2px;display:inline-block}
table.token-table{width:100%;border-collapse:collapse;font-size:11px}
table.token-table th{background:var(--bg4);color:var(--dim);text-align:left;padding:4px 8px;border:1px solid var(--border);font-size:10px}
table.token-table td{padding:3px 8px;border:1px solid var(--border)}
table.token-table tr{cursor:pointer;transition:background 0.1s}
table.token-table tr:hover{background:var(--bg4)}
table.token-table tr.in-region{background:var(--region-bg)}
table.token-table tr.user-region{background:var(--user-region)}
table.token-table tr.both-region{background:#1a3a2e}
table.token-table tr.over-detect{background:var(--over-detect)}
table.token-table tr.under-detect{background:var(--under-detect)}
table.token-table tr.marker-start td:first-child{border-left:3px solid var(--green)}
table.token-table tr.marker-end td:first-child{border-left:3px solid var(--red)}
table.token-table .token-col{font-weight:500}
table.token-table .click-hint{color:var(--dim);font-size:10px;font-style:italic}
.qwen-box{margin:14px 20px;background:var(--qwen-bg);border:1px solid #7c3aed;border-radius:6px;padding:10px 14px}
.qwen-box .qwen-title{font-size:11px;color:#c084fc;font-weight:600;margin-bottom:6px}
.qwen-box .qwen-text{font-size:11px;line-height:1.8;color:#e9d5ff;white-space:pre-wrap}
.conf-high{color:var(--green)}.conf-med{color:var(--yellow)}.conf-low{color:var(--red)}.conf-null{color:#484f58;font-style:italic}
.conf-bar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle;margin-left:4px;min-width:2px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);color:var(--fg);border:1px solid var(--green);border-radius:8px;padding:10px 16px;font-size:12px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>ConsultAI — Annotation régions médicaments + Qwen3.5-9B</h1>
    <div class="subtitle">Détection algo vs Qwen (brut, erreurs STT intactes) vs annotation manuelle. Cliquez sur les tokens pour annoter.</div>
  </div>
  <div class="export-bar">
    <button class="btn btn-primary" onclick="exportJSON()">Exporter annotations</button>
    <button class="btn" onclick="copyJSON()">Copier JSON</button>
    <button class="btn btn-reset" onclick="resetAll()">Réinitialiser</button>
    <span id="annotation-count" style="font-size:11px;color:var(--dim)">0/25 régions annotées</span>

  <div id="stats-panel" class="stats-grid"></div>

    <label style="color:var(--dim);font-size:11px"><input type="checkbox" id="filter-annotated"/> Annotées</label>
    <label style="color:var(--dim);font-size:11px"><input type="checkbox" id="filter-diverge"/> Divergentes</label>
  </div>
  <table class="summary"><thead><tr>

    <th data-sort="annotated">Annotation</th>
  </tr></thead><tbody id="summary-body"></tbody></table>
  <div id="consultations"></div>
</div>

function getAnnotation(cId,rIdx){if(!annotations[cId])annotations[cId]={};if(!annotations[cId][rIdx])annotations[cId][rIdx]={start:null,end:null,note:''};return annotations[cId][rIdx];}
function confClass(v){return v===null||v===undefined?'conf-null':v>=0.9?'conf-high':v>=0.7?'conf-med':'conf-low';}
function confColor(v){return v===null||v===undefined?'#484f58':v>=0.9?'#3fb950':v>=0.7?'#d29922':'#f85149';}
function confBar(v){if(v===null||v===undefined)return'';return'<span class="conf-bar" style="width:'+Math.max(2,Math.round(v*60))+'px;background:'+confColor(v)+'"></span>';}
function fmtConf(v){if(v===null||v===undefined)return'<span class="conf-null">&mdash;</span>';return'<span class="'+confClass(v)+'">'+v.toFixed(3)+'</span>'+confBar(v);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function toggleConsult(id){document.getElementById('consult-'+id)?.classList.toggle('open');}
function renderStats(){
  const cs=Object.values(DATA),totalR=cs.reduce((s,c)=>s+c.nb_regions,0);
  const allT=cs.flatMap(c=>c.regions.flatMap(r=>r.tokens)),regT=allT.filter(t=>t.in_region);
  const confs=regT.map(t=>t.conf).filter(v=>v!==null);
  const avg=confs.length?confs.reduce((a,b)=>a+b,0)/confs.length:0;
  const low=regT.filter(t=>t.conf!==null&&t.conf<0.7).length;
  const det=cs.flatMap(c=>(c.med_grounding_items||[]).filter(i=>!i.source));
  const phon=cs.flatMap(c=>(c.med_grounding_items||[]).filter(i=>i.source==='phonetic'));
  const qT=Object.values(QWEN).map(v=>v.time_s||0);
  const qAvg=qT.length?qT.reduce((a,b)=>a+b,0)/qT.length:0;
  document.getElementById('stats-panel').innerHTML=
    '<div class="stat-card"><div class="stat-label">Consultations</div><div class="stat-value">'+cs.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Régions</div><div class="stat-value">'+totalR+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Tokens région</div><div class="stat-value">'+regT.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Items det/phon</div><div class="stat-value">'+det.length+'/'+phon.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Conf moy</div><div class="stat-value">'+avg.toFixed(3)+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Conf &lt;0.7</div><div class="stat-value" style="color:'+(low?'var(--red)':'var(--green)')+'">'+low+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Qwen moy</div><div class="stat-value" style="color:#c084fc">'+qAvg.toFixed(2)+'s</div></div>';
}
function renderSummary(){
  const tbody=document.getElementById('summary-body');
  const cs=Object.values(DATA).sort((a,b)=>a.consultation_id-b.consultation_id);
  tbody.innerHTML=cs.map(c=>{
    const items=c.med_grounding_items||[];
    const det=items.filter(i=>!i.source).length,phon=items.filter(i=>i.source==='phonetic').length;
    const q=QWEN[String(c.consultation_id)];
    const annots=c.regions.map((r,ri)=>getAnnotation(c.consultation_id,ri));
    const annotated=annots.filter(a=>a.start!==null).length;
    const status=annotated===0?'<span class="badge badge-pending">en attente</span>':'<span class="badge badge-annotated">'+annotated+' OK</span>';
    return'<tr onclick="toggleConsult('+c.consultation_id+')">'+
      '<td><strong>'+c.consultation_id+'</strong></td><td>'+esc(c.title)+'</td><td>'+c.nb_regions+'</td>'+
      '<td>'+items.length+'</td>'+
      '<td>'+(det?'<span class="badge badge-det">'+det+'</span>':'&mdash;')+'</td>'+
      '<td>'+(phon?'<span class="badge badge-phon">'+phon+'</span>':'&mdash;')+'</td>'+
      '<td>'+(c.inline_fixed.length?c.inline_fixed.map(f=>'<span class="inline-tag">'+esc(f)+'</span>').join(' '):'&mdash;')+'</td>'+
      '<td><span class="badge badge-qwen">'+(q?q.time_s+'s':'&mdash;')+'</span></td>'+
      '<td>'+status+'</td></tr>';
  }).join('');
}
function onTokenClick(cId,rIdx,tokenIdx){
  const a=getAnnotation(cId,rIdx);
  if(a.start===null){a.start=tokenIdx;toast('▶ '+tokenIdx);}
  else if(a.end===null){if(tokenIdx<a.start){a.end=a.start;a.start=tokenIdx;}else{a.end=tokenIdx;}toast('◀ '+tokenIdx);}
  else{a.start=tokenIdx;a.end=null;toast('▶ '+tokenIdx);}
  renderRegion(cId,rIdx);updateAnnotationCount();renderSummary();
}
function resetRegion(cId,rIdx){const a=getAnnotation(cId,rIdx);a.start=null;a.end=null;a.note='';renderRegion(cId,rIdx);updateAnnotationCount();renderSummary();toast('Réinitialisé');}
function updateNote(cId,rIdx,val){getAnnotation(cId,rIdx).note=val;}
function updateAnnotationCount(){let t=0,d=0;Object.values(DATA).forEach(c=>c.regions.forEach((r,ri)=>{t++;if(getAnnotation(c.consultation_id,ri).start!==null)d++;}));document.getElementById('annotation-count').textContent=d+'/'+t+' régions annotées';}
function renderRegion(cId,rIdx){
  const c=DATA[String(cId)],r=c.regions[rIdx],a=getAnnotation(cId,rIdx);
  const el=document.getElementById('region-'+cId+'-'+rIdx);if(!el)return;
  const hasA=a.start!==null&&a.end!==null,uS=a.start,uE=a.end;
  const tokenRows=r.tokens.map(t=>{
    const inD=t.in_region,inU=hasA&&t.idx>=uS&&t.idx<=uE;
    let cls='';if(inD&&inU)cls='both-region';else if(inD&&!inU)cls='over-det';else if(!inD&&inU)cls='under-det';
    if(t.idx===uS)cls+=' marker-start';if(t.idx===uE)cls+=' marker-end';
    const m=t.idx===uS?' ▶':t.idx===uE?' ◀':'';
    const ch=!hasA?' <span class="click-hint">(cliquer)</span>':'';
    return'<tr class="'+cls+'" onclick="onTokenClick('+cId+','+rIdx+','+t.idx+')" data-conf="'+(t.conf||0)+'" data-region="'+inD+'">'+
      '<td style="color:var(--dim);font-size:10px">'+t.idx+'</td>'+
      '<td class="token-col">'+esc(t.token)+m+ch+'</td>'+
      '<td style="text-align:center">'+(inD?'<span style="color:var(--green)">●</span>':'<span style="color:var(--dim)">○</span>')+'</td>'+
      '<td>'+fmtConf(t.conf)+'</td></tr>';
  }).join('');
  const textHtml=r.tokens.map(t=>{
    const inD=t.in_region,inU=hasA&&t.idx>=uS&&t.idx<=uE;
    let cls='ctx';if(inD&&inU)cls='med-both';else if(inD&&!inU)cls='over-det';else if(!inD&&inU)cls='under-det';else if(inD)cls='med-det';
    return'<span class="'+cls+'" title="idx:'+t.idx+' conf:'+(t.conf!==null?t.conf.toFixed(3):'—')+'">'+esc(t.token)+'</span>';
  }).join(' ');
  let annotStatus='';
  if(hasA){const m=uS===r.token_start&&uE===r.token_end;annotStatus='<span class="marker marker-start">▶ '+uS+'</span> → <span class="marker marker-end">◀ '+uE+'</span>'+(m?' <span class="badge badge-annotated">identique</span>':' <span class="badge" style="background:#3d2e1a;color:var(--yellow)">diverge</span>');}
  else if(a.start!==null)annotStatus='<span class="marker marker-start">▶ '+a.start+'</span> → <span class="marker marker-none">fin</span>';
  else annotStatus='<span class="marker marker-none">cliquer début</span>';
  el.innerHTML=
    '<div class="region-text">'+textHtml+'</div>'+
    '<div class="annotation-bar">'+
      '<span class="label">Algo : <span class="marker marker-start" style="cursor:default">'+r.token_start+'</span> → <span class="marker marker-end" style="cursor:default">'+r.token_end+'</span></span>'+
      '<span class="label" style="margin-left:12px">Annotation : '+annotStatus+'</span>'+
      '<button class="btn btn-sm btn-reset" onclick="event.stopPropagation();resetRegion('+cId+','+rIdx+')">Réinit</button>'+
      '<div class="annotation-note"><input type="text" placeholder="Note…" value="'+esc(a.note||'')+'" oninput="updateNote('+cId+','+rIdx+',this.value)" onclick="event.stopPropagation()"/></div>'+
    '</div>'+
    '<div class="legend">'+
      '<div class="legend-item"><span class="legend-swatch" style="background:var(--region-bg);border:1px solid var(--green)"></span> Algo</div>'+
      '<div class="legend-item"><span class="legend-swatch" style="background:var(--user-region);border:1px solid var(--accent)"></span> Annotation</div>'+
      '<div class="legend-item"><span class="legend-swatch" style="background:#1a3a2e;border:1px solid #7ee787"></span> Accord</div>'+
      '<div class="legend-item"><span class="legend-swatch" style="background:var(--over-detect);border:1px solid var(--red)"></span> Sur-détection</div>'+
      '<div class="legend-item"><span class="legend-swatch" style="background:var(--under-detect);border:1px solid var(--orange)"></span> Sous-détection</div>'+
    '</div>'+
    '<table class="token-table"><thead><tr><th>idx</th><th>Token</th><th>Algo</th><th>Confiance STT</th></tr></thead><tbody>'+tokenRows+'</tbody></table>';
  el.closest('.region-block').classList.toggle('annotated',hasA);
}
function renderConsultations(){
  const container=document.getElementById('consultations');
  const cs=Object.values(DATA).sort((a,b)=>a.consultation_id-b.consultation_id);
  container.innerHTML=cs.map(c=>{
    const items=c.med_grounding_items||[];
    const det=items.filter(i=>!i.source),phon=items.filter(i=>i.source==='phonetic');
    const inlineH=c.inline_fixed.length?c.inline_fixed.map(f=>'<span class="inline-tag">'+esc(f)+'</span>').join(' '):'<span style="color:var(--dim)">aucun</span>';
    const itemsRows=items.map(it=>{
      const src=it.source?'phonetic':'det';
      return'<tr class="'+(src==='phonetic'?'phonetic':'')+'"><td><span class="badge badge-'+src+'">'+src+'</span></td>'+
        '<td><strong>'+esc(it.name)+'</strong></td><td>'+esc(it.base||'')+'</td><td>'+esc(it.posology||'')+'</td>'+
        '<td style="text-align:right">'+(it.score||'&mdash;')+'</td><td>'+(it.conf!==undefined?fmtConf(it.conf):'&mdash;')+'</td>'+
        '<td>'+(it.garble?'<span class="garble">'+esc(it.garble)+'</span>':'&mdash;')+'</td></tr>';
    }).join('');
    const regionsH=c.regions.map((r,ri)=>
      '<div class="region-block" id="region-block-'+c.consultation_id+'-'+ri+'">'+
      '<div class="region-block-header"><span class="label" style="color:var(--green)">Région '+(ri+1)+' · tokens '+r.token_start+'&ndash;'+r.token_end+' ('+(r.token_end-r.token_start+1)+' tokens)</span></div>'+
      '<div id="region-'+c.consultation_id+'-'+ri+'"></div></div>').join('');
    const q=QWEN[String(c.consultation_id)];
    const qwenBox=q&&q.text?
      '<div class="qwen-box"><div class="qwen-title">Qwen3.5-9B ('+q.time_s+'s, '+q.prompt_tokens+'/'+q.completion_tokens+' tokens)</div>'+
      '<div class="qwen-text">'+esc(q.text)+'</div></div>':'';
    return'<div class="consult" id="consult-'+c.consultation_id+'">'+
      '<div class="consult-header" onclick="toggleConsult('+c.consultation_id+')">'+
      '<div><span class="chevron">▶</span><h2>#'+c.consultation_id+' — '+esc(c.title)+'</h2></div>'+
      '<div class="meta">'+c.nb_regions+' région(s) · '+items.length+' items · inline: '+inlineH+'</div></div>'+
      '<div class="consult-body">'+
      '<div class="section"><div class="section-title">Médicaments résolus + phonétiques</div>'+
      '<table class="items-table"><thead><tr><th>Source</th><th>Nom</th><th>Base</th><th>Posologie</th><th>Score</th><th>Conf</th><th>Garble</th></tr></thead>'+
      '<tbody>'+(itemsRows||'<tr><td colspan="7" style="color:var(--dim)">aucun</td></tr>')+'</tbody></table></div>'+
      (c.inline_fixed.length?'<div class="section"><div class="section-title">Corrections inline</div><div class="inline-list">'+inlineH+'</div></div>':'')+
      qwenBox+
      '<div class="section"><div class="section-title">Régions médicaments ('+c.nb_regions+')</div>'+regionsH+'</div>'+
      '</div></div>';
  }).join('');
  cs.forEach(c=>c.regions.forEach((r,ri)=>renderRegion(c.consultation_id,ri)));
  updateAnnotationCount();
}
function buildExport(){const anns=[];let annotated=0,match=0,diverge=0;Object.values(DATA).forEach(c=>c.regions.forEach((r,ri)=>{const a=getAnnotation(c.consultation_id,ri);const hasA=a.start!==null&&a.end!==null;if(hasA){annotated++;if(a.start===r.token_start&&a.end===r.token_end)match++;else diverge++;}anns.push({consultation_id:c.consultation_id,region_idx:ri,detected_start:r.token_start,detected_end:r.token_end,user_start:a.start,user_end:a.end,match:hasA?(a.start===r.token_start&&a.end===r.token_end):null,note:a.note||''});}));return{exported_at:new Date().toISOString(),annotations:anns,summary:{total:anns.length,annotated,match,diverge}};}
function exportJSON(){const d=buildExport();const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='annotations.json';a.click();URL.revokeObjectURL(u);toast('Téléchargé');}
function copyJSON(){navigator.clipboard.writeText(JSON.stringify(buildExport(),null,2)).then(()=>toast('Copié')).catch(()=>{});}
function resetAll(){Object.keys(annotations).forEach(k=>delete annotations[k]);Object.values(DATA).forEach(c=>c.regions.forEach((r,ri)=>renderRegion(c.consultation_id,ri)));updateAnnotationCount();renderSummary();toast('Réinitialisé');}
function applyFilters(){const text=document.getElementById('filter-text').value.toLowerCase();const confMin=parseFloat(document.getElementById('filter-conf').value);const annotOnly=document.getElementById('filter-annotated').checked;const divOnly=document.getElementById('filter-diverge').checked;document.getElementById('conf-val').textContent=confMin.toFixed(2);document.querySelectorAll('.consult').forEach(el=>{const cId=el.id.replace('consult-','');const c=DATA[cId];if(!c)return;let show=true;if(annotOnly&&!c.regions.some((r,ri)=>getAnnotation(c.consultation_id,ri).start!==null))show=false;if(divOnly&&!c.regions.some((r,ri)=>{const a=getAnnotation(c.consultation_id,ri);return a.start!==null&&a.end!==null&&(a.start!==r.token_start||a.end!==r.token_end);}))show=false;el.style.display=show?'':'none';});document.querySelectorAll('table.token-table tbody tr').forEach(tr=>{const token=tr.children[1]?.textContent?.toLowerCase()?.replace(/ ▶| ◀/g,'')||'';const conf=parseFloat(tr.dataset.conf)||0;let show=true;if(text&&!token.includes(text))show=false;if(conf<confMin&&conf>0)show=false;tr.style.display=show?'':'none';});}
document.getElementById('filter-text').addEventListener('input',applyFilters);
document.getElementById('filter-conf').addEventListener('input',applyFilters);
document.getElementById('filter-annotated').addEventListener('change',applyFilters);
document.getElementById('filter-diverge').addEventListener('change',applyFilters);
renderStats();renderSummary();renderConsultations();
</script>
</body>
</html>
