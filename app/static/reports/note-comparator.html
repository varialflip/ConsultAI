const CASE_LABELS = {

const CASE_ORDER = ["7","8","9","10","11","12","13"];

function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  document.getElementById('theme-toggle').textContent = next === 'dark' ? 'Mode clair' : 'Mode sombre';
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, '<em>$1</em>');
  s = s.replace(/`([^`]+?)`/g, '<code>$1</code>');
  return s;
}

// Minimal, dependency-free Markdown -> HTML renderer covering what
// model_bench.py's generated notes actually use: headers, bold/italic,
// pipe tables, ordered/unordered lists, horizontal rules, paragraphs.
function renderMarkdown(md) {
  if (!md) return '<div class="note-empty">(aucune note)</div>';
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let html = '';
  let i = 0;
  let inUl = false, inOl = false;
  function closeLists() {
    if (inUl) { html += '</ul>'; inUl = false; }
    if (inOl) { html += '</ol>'; inOl = false; }
  }
  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    if (trimmed === '') { closeLists(); i++; continue; }

    if (/^---+$/.test(trimmed)) { closeLists(); html += '<hr>'; i++; continue; }

    const h = trimmed.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeLists(); html += `<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`; i++; continue; }

    if (trimmed.startsWith('|')) {
      closeLists();
      const tableLines = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) { tableLines.push(lines[i].trim()); i++; }
      const rows = tableLines.map(l => l.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
      const isSep = r => r.every(c => /^:?-+:?$/.test(c));
      let head = null, body = rows;
      if (rows.length > 1 && isSep(rows[1])) { head = rows[0]; body = rows.slice(2); }
      html += '<table>';
      if (head) html += '<thead><tr>' + head.map(c => `<th>${inlineMd(c)}</th>`).join('') + '</tr></thead>';
      html += '<tbody>' + body.map(r => '<tr>' + r.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') + '</tbody>';
      html += '</table>';
      continue;
    }

    const ol = trimmed.match(/^\d+[.)]\s+(.*)$/);
    if (ol) {
      if (!inOl) { closeLists(); html += '<ol>'; inOl = true; }
      html += `<li>${inlineMd(ol[1])}</li>`;
      i++; continue;
    }

    const ul = trimmed.match(/^[-*]\s+(.*)$/);
    if (ul) {
      if (!inUl) { closeLists(); html += '<ul>'; inUl = true; }
      html += `<li>${inlineMd(ul[1])}</li>`;
      i++; continue;
    }

    closeLists();
    html += `<p>${inlineMd(trimmed)}</p>`;
    i++;
  }
  closeLists();
  return html;
}

function fmtSecs(v) { return v == null ? '—' : v.toFixed(1) + ' s'; }
function fmtTokens(v) { return v == null ? '—' : v.toLocaleString('fr-CA') + ' jt'; }

function renderPatientPills() {
  const el = document.getElementById('patient-pills');
  el.querySelectorAll('.pill-btn').forEach(n => n.remove());
  CASE_ORDER.forEach(c => {
    if (!DATA[c]) return;
    const btn = document.createElement('button');
    btn.className = 'pill-btn' + (c === state.case ? ' active' : '');
    btn.type = 'button';
    btn.textContent = CASE_LABELS[c] || `Cas ${c}`;
    btn.onclick = () => { state.case = c; renderAll(); };
    el.appendChild(btn);
  });
}

function variantsForCase() {
  return DATA[state.case] || [];
}

function renderColumns() {
  const row = document.getElementById('columns-row');
  row.innerHTML = '';
  const variants = variantsForCase();

  state.columns.forEach((variantIdx, colPos) => {
    const idx = Math.min(variantIdx, Math.max(0, variants.length - 1));
    state.columns[colPos] = idx;
    const v = variants[idx];

    const col = document.createElement('div');
    col.className = 'note-column';

    const head = document.createElement('div');
    head.className = 'note-column-head';

    const select = document.createElement('select');
    variants.forEach((vv, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = vv.label;
      if (i === idx) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = (e) => { state.columns[colPos] = parseInt(e.target.value, 10); renderColumns(); };
    head.appendChild(select);

    const meta = document.createElement('div');
    meta.className = 'note-column-meta';
    if (v) {
      meta.innerHTML = `<span>⏱ ${fmtSecs(v.elapsed)}</span><span>🔤 ${fmtTokens(v.tokens)}</span>`;
    }
    if (state.columns.length > 2) {
      const rm = document.createElement('span');
      rm.className = 'remove-col';
      rm.textContent = '✕ retirer';
      rm.onclick = () => { state.columns.splice(colPos, 1); renderAll(); };
      meta.appendChild(rm);
    }
    head.appendChild(meta);
    col.appendChild(head);

    const body = document.createElement('div');
    body.className = 'note-body';
    body.innerHTML = v ? renderMarkdown(v.note) : '<div class="note-empty">(pas de résultat pour ce patient)</div>';
    body.addEventListener('scroll', () => onColumnScroll(body));
    col.appendChild(body);

    row.appendChild(col);
  });

  document.getElementById('remove-col').disabled = state.columns.length <= 2;
}

let scrollSyncing = false;
function onColumnScroll(source) {
  if (!state.syncScroll || scrollSyncing) return;
  const ratio = source.scrollTop / Math.max(1, (source.scrollHeight - source.clientHeight));
  scrollSyncing = true;
  document.querySelectorAll('.note-body').forEach(el => {
    if (el === source) return;
    el.scrollTop = ratio * (el.scrollHeight - el.clientHeight);
  });
  requestAnimationFrame(() => { scrollSyncing = false; });
}

function onSyncToggle() {
  state.syncScroll = document.getElementById('sync-scroll').checked;
}

function addColumn() {
  if (state.columns.length >= 5) return;
  const variants = variantsForCase();
  const nextIdx = Math.min(state.columns.length, Math.max(0, variants.length - 1));
  state.columns.push(nextIdx);
  renderAll();
}
function removeColumn() {
  if (state.columns.length <= 2) return;
  state.columns.pop();
  renderAll();
}

function renderAll() {
  renderPatientPills();
  renderColumns();
}

renderAll();
</script>
