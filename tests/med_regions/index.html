<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConsultAI — Régions médicaments (extraction test)</title>
<style>
:root {
  --bg: #0d1117; --fg: #c9d1d9; --dim: #8b949e; --border: #30363d;
  --accent: #58a6ff; --green: #3fb950; --yellow: #d29922; --red: #f85149;
  --orange: #db6d28; --bg2: #161b22; --bg3: #1c2128; --bg4: #21262d;
  --region-bg: #1a3a1a; --region-border: #3fb950;
  --ctx-bg: #1a1a2e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace; background: var(--bg); color: var(--fg); font-size: 13px; line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.container { max-width: 1400px; margin: 0 auto; padding: 16px; }

/* Header */
.header { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; }
.header h1 { font-size: 18px; color: var(--accent); margin-bottom: 4px; }
.header .subtitle { color: var(--dim); font-size: 12px; }

/* Summary table */
.summary { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 12px; }
.summary th { background: var(--bg3); color: var(--accent); text-align: left; padding: 8px 10px; border: 1px solid var(--border); position: sticky; top: 0; z-index: 10; cursor: pointer; user-select: none; }
.summary th:hover { background: var(--bg4); }
.summary td { padding: 6px 10px; border: 1px solid var(--border); vertical-align: top; }
.summary tr:hover { background: var(--bg2); }
.summary tr.active { background: var(--bg4); }
.badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.badge-det { background: #1f3d5c; color: var(--accent); }
.badge-phon { background: #3d2e1f; color: var(--orange); }
.badge-count { background: var(--bg4); color: var(--fg); font-size: 11px; }

/* Filters */
.filters { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
.filters input, .filters select { background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 5px 10px; font-family: inherit; font-size: 12px; }
.filters input:focus, .filters select:focus { border-color: var(--accent); outline: none; }
.filters label { color: var(--dim); font-size: 11px; }

/* Consultation detail */
.consult { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; margin: 16px 0; overflow: hidden; }
.consult-header { padding: 14px 20px; background: var(--bg3); border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.consult-header:hover { background: var(--bg4); }
.consult-header h2 { font-size: 14px; color: var(--fg); }
.consult-header .meta { color: var(--dim); font-size: 11px; }
.consult-body { padding: 0; display: none; }
.consult.open .consult-body { display: block; }
.consult.open .chevron { transform: rotate(90deg); }
.chevron { transition: transform 0.15s; color: var(--dim); }

/* Sections */
.section { padding: 14px 20px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: none; }
.section-title { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

/* Items table */
.items-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.items-table th { background: var(--bg4); color: var(--dim); text-align: left; padding: 5px 8px; border: 1px solid var(--border); }
.items-table td { padding: 4px 8px; border: 1px solid var(--border); }
.items-table tr.phonetic { background: #1a1a2e; }
.items-table .garble { color: var(--yellow); font-style: italic; }
.items-table .score { text-align: right; }

/* Inline fixed */
.inline-list { display: flex; gap: 6px; flex-wrap: wrap; }
.inline-tag { background: #1f3d5c; color: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 11px; }

/* Region */
.region { margin: 12px 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.region-header { padding: 10px 14px; background: var(--bg3); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.region-header .label { font-size: 12px; color: var(--green); font-weight: 600; }
.region-header .stats { font-size: 11px; color: var(--dim); }
.region-text { padding: 10px 14px; font-size: 12px; line-height: 1.8; }
.region-text .ctx { color: var(--dim); }
.region-text .med { color: var(--green); font-weight: 600; background: var(--region-bg); padding: 1px 3px; border-radius: 2px; }

/* Token table */
.token-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.token-table th { background: var(--bg4); color: var(--dim); text-align: left; padding: 4px 8px; border: 1px solid var(--border); font-size: 10px; }
.token-table td { padding: 3px 8px; border: 1px solid var(--border); }
.token-table tr.in-region { background: var(--region-bg); }
.token-table tr.in-region td { border-color: #2a5a2a; }
.token-table .token-col { font-weight: 500; }
.token-table tr.in-region .token-col { color: var(--green); }

/* Confidence colors */
.conf-high { color: var(--green); }
.conf-med { color: var(--yellow); }
.conf-low { color: var(--red); }
.conf-null { color: #484f58; font-style: italic; }

/* Confidence bar */
.conf-bar { display: inline-block; height: 8px; border-radius: 2px; vertical-align: middle; margin-left: 4px; min-width: 2px; }

/* Stats panel */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.stat-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.stat-card .stat-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .stat-value { font-size: 20px; font-weight: 700; color: var(--fg); margin-top: 2px; }
.stat-card .stat-detail { font-size: 10px; color: var(--dim); margin-top: 2px; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }

/* Responsive */
@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .summary { font-size: 10px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>ConsultAI — Régions médicaments</h1>
    <div class="subtitle">Extraction des régions « liste de médicaments » confirmées par <code>_medlist_regions</code>, ±10 mots de contexte, confiance STT par token. Données de test (<code>tests/med_regions/</code>).</div>
  </div>

  <div id="stats-panel" class="stats-grid"></div>

  <div class="filters">
    <label>Recherche : <input type="text" id="filter-text" placeholder="token, médicament…" /></label>
    <label>Conf min : <input type="range" id="filter-conf" min="0" max="1" step="0.05" value="0" /><span id="conf-val">0</span></label>
    <label>Source : <select id="filter-source"><option value="">Toutes</option><option value="det">Déterministe</option><option value="phonetic">Phonétique</option></select></label>
    <label><input type="checkbox" id="filter-low-conf" /> Tokens conf &lt; 0.7 seulement</label>
  </div>

  <table class="summary" id="summary-table">
    <thead>
      <tr>
        <th data-sort="id">#</th>
        <th data-sort="title">Titre</th>
        <th data-sort="regions">Régions</th>
        <th data-sort="items">Items</th>
        <th data-sort="det">Det</th>
        <th data-sort="phon">Phon</th>
        <th data-sort="inline">Inline</th>
        <th data-sort="tokens">Tokens</th>
        <th data-sort="conf-avg">Conf moy</th>
        <th data-sort="conf-low">Conf &lt;0.7</th>
      </tr>
    </thead>
    <tbody id="summary-body"></tbody>
  </table>

  <div id="consultations"></div>
</div>

function renderStats() {
  const panel = document.getElementById('stats-panel');
  const consults = Object.values(DATA);
  const totalRegions = consults.reduce((s,c) => s + c.nb_regions, 0);
  const allTokens = consults.flatMap(c => c.regions.flatMap(r => r.tokens));
  const regionTokens = allTokens.filter(t => t.in_region);
  const ctxTokens = allTokens.filter(t => !t.in_region);
  const confs = allTokens.map(t => t.conf).filter(v => v !== null);
  const regionConfs = regionTokens.map(t => t.conf).filter(v => v !== null);
  const lowConf = regionTokens.filter(t => t.conf !== null && t.conf < 0.7);
  const phonItems = consults.flatMap(c => (c.med_grounding_items || []).filter(i => i.source === 'phonetic'));
  const detItems = consults.flatMap(c => (c.med_grounding_items || []).filter(i => !i.source));
  const avgConf = confs.length ? (confs.reduce((a,b) => a+b, 0) / confs.length) : 0;
  const avgRegionConf = regionConfs.length ? (regionConfs.reduce((a,b) => a+b, 0) / regionConfs.length) : 0;

  panel.innerHTML = `
    <div class="stat-card"><div class="stat-label">Consultations</div><div class="stat-value">${consults.length}</div></div>
    <div class="stat-card"><div class="stat-label">Régions médicaments</div><div class="stat-value">${totalRegions}</div></div>
    <div class="stat-card"><div class="stat-label">Tokens région</div><div class="stat-value">${regionTokens.length}</div><div class="stat-detail">sur ${allTokens.length} total</div></div>
    <div class="stat-card"><div class="stat-label">Items déterministes</div><div class="stat-value">${detItems.length}</div></div>
    <div class="stat-card"><div class="stat-label">Items phonétiques</div><div class="stat-value">${phonItems.length}</div></div>
    <div class="stat-card"><div class="stat-label">Conf moyenne (région)</div><div class="stat-value">${avgRegionConf.toFixed(3)}</div><div class="stat-detail">globale: ${avgConf.toFixed(3)}</div></div>
    <div class="stat-card"><div class="stat-label">Conf &lt; 0.7 (région)</div><div class="stat-value" style="color:${lowConf.length > 0 ? 'var(--red)' : 'var(--green)'}">${lowConf.length}</div><div class="stat-detail">tokens région à confiance faible</div></div>
  `;
}

function renderSummary() {
  const tbody = document.getElementById('summary-body');
  const consults = Object.values(DATA).sort((a,b) => a.consultation_id - b.consultation_id);
  tbody.innerHTML = consults.map(c => {
    const items = c.med_grounding_items || [];
    const det = items.filter(i => !i.source).length;
    const phon = items.filter(i => i.source === 'phonetic').length;
    const regionTokens = c.regions.flatMap(r => r.tokens.filter(t => t.in_region));
    const confs = regionTokens.map(t => t.conf).filter(v => v !== null);
    const avgConf = confs.length ? (confs.reduce((a,b) => a+b, 0) / confs.length) : 0;
    const lowConf = regionTokens.filter(t => t.conf !== null && t.conf < 0.7).length;
    return `<tr data-id="${c.consultation_id}" onclick="toggleConsult(${c.consultation_id})">
      <td><strong>${c.consultation_id}</strong></td>
      <td>${escHtml(c.title)}</td>
      <td>${c.nb_regions}</td>
      <td>${items.length}</td>
      <td>${det ? '<span class="badge badge-det">'+det+'</span>' : '—'}</td>
      <td>${phon ? '<span class="badge badge-phon">'+phon+'</span>' : '—'}</td>
      <td>${c.inline_fixed.length ? c.inline_fixed.map(f => '<span class="inline-tag">'+escHtml(f)+'</span>').join(' ') : '—'}</td>
      <td>${regionTokens.length}</td>
      <td><span class="${confClass(avgConf)}">${avgConf.toFixed(3)}</span></td>
      <td style="color:${lowConf > 0 ? 'var(--red)' : 'var(--green)'}">${lowConf}</td>
    </tr>`;
  }).join('');
}

function renderConsultations() {
  const container = document.getElementById('consultations');
  const consults = Object.values(DATA).sort((a,b) => a.consultation_id - b.consultation_id);
  container.innerHTML = consults.map(c => {
    const items = c.med_grounding_items || [];
    const detItems = items.filter(i => !i.source);
    const phonItems = items.filter(i => i.source === 'phonetic');
    const inlineHtml = c.inline_fixed.length
      ? c.inline_fixed.map(f => `<span class="inline-tag">${escHtml(f)}</span>`).join(' ')
      : '<span style="color:var(--dim)">aucun</span>';

    const itemsTableRows = items.map(it => {
      const src = it.source ? 'phonetic' : 'det';
      const garble = it.garble ? `<span class="garble">${escHtml(it.garble)}</span>` : '—';
      const conf = it.conf !== undefined ? fmtConf(it.conf) : '—';
      const score = it.score !== undefined ? it.score : '—';
      return `<tr class="${src === 'phonetic' ? 'phonetic' : ''}">
        <td><span class="badge badge-${src}">${src}</span></td>
        <td><strong>${escHtml(it.name)}</strong></td>
        <td>${escHtml(it.base || '')}</td>
        <td>${escHtml(it.posology || '')}</td>
        <td class="score">${score}</td>
        <td>${escHtml(it.level || '')}</td>
        <td>${conf}</td>
        <td>${garble}</td>
      </tr>`;
    }).join('');

    const regionsHtml = c.regions.map((r, ri) => {
      const regionTokens = r.tokens.filter(t => t.in_region);
      const ctxTokens = r.tokens.filter(t => !t.in_region);
      const regionConfs = regionTokens.map(t => t.conf).filter(v => v !== null);
      const avgConf = regionConfs.length ? (regionConfs.reduce((a,b) => a+b,0) / regionConfs.length) : 0;
      const lowConf = regionTokens.filter(t => t.conf !== null && t.conf < 0.7);

      // Highlighted region text
      const highlightedText = r.tokens.map(t => {
        if (t.in_region) return `<span class="med" title="idx:${t.idx} conf:${t.conf !== null ? t.conf.toFixed(3) : '—'}">${escHtml(t.token)}</span>`;
        return `<span class="ctx">${escHtml(t.token)}</span>`;
      }).join(' ');

      // Token table
      const tokenRows = r.tokens.map(t => {
        const cls = t.in_region ? 'in-region' : '';
        return `<tr class="${cls}" data-conf="${t.conf || 0}" data-region="${t.in_region}">
          <td style="color:var(--dim);font-size:10px">${t.idx}</td>
          <td class="token-col">${escHtml(t.token)}</td>
          <td style="text-align:center">${t.in_region ? '<span style="color:var(--green)">●</span>' : '<span style="color:var(--dim)">○</span>'}</td>
          <td>${fmtConf(t.conf)}</td>
        </tr>`;
      }).join('');

      return `<div class="region">
        <div class="region-header">
          <span class="label">Région ${ri+1} · tokens ${r.token_start}–${r.token_end} (${regionTokens.length} méd)</span>
          <span class="stats">conf moy: <span class="${confClass(avgConf)}">${avgConf.toFixed(3)}</span> · conf &lt;0.7: <span style="color:${lowConf.length ? 'var(--red)' : 'var(--green)'}">${lowConf.length}</span></span>
        </div>
        <div class="region-text">${highlightedText}</div>
        <div style="padding:0 14px 10px">
          <table class="token-table">
            <thead><tr><th>idx</th><th>Token</th><th>Région</th><th>Confiance STT</th></tr></thead>
            <tbody>${tokenRows}</tbody>
          </table>
        </div>
      </div>`;
    }).join('');

    return `<div class="consult" id="consult-${c.consultation_id}">
      <div class="consult-header" onclick="toggleConsult(${c.consultation_id})">
        <div>
          <span class="chevron">▶</span>
          <h2 style="display:inline;margin-left:8px">#${c.consultation_id} — ${escHtml(c.title)}</h2>
        </div>
        <div class="meta">${c.nb_regions} région(s) · ${items.length} items (${detItems.length} det, ${phonItems.length} phon) · inline: ${inlineHtml}</div>
      </div>
      <div class="consult-body">
        <div class="section">
          <div class="section-title">Médicaments résolus + phonétiques</div>
          <table class="items-table">
            <thead><tr><th>Source</th><th>Nom</th><th>Base</th><th>Posologie</th><th>Score</th><th>Niveau</th><th>Confiance</th><th>Garble</th></tr></thead>
            <tbody>${itemsTableRows || '<tr><td colspan="8" style="color:var(--dim)">aucun item</td></tr>'}</tbody>
          </table>
        </div>
        ${c.inline_fixed.length ? `<div class="section"><div class="section-title">Corrections inline</div><div class="inline-list">${inlineHtml}</div></div>` : ''}
        <div class="section">
          <div class="section-title">Régions médicaments (${c.nb_regions})</div>
          ${regionsHtml || '<div style="color:var(--dim);padding:10px 0">aucune région détectée</div>'}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleConsult(id) {
  const el = document.getElementById('consult-' + id);
  if (el) el.classList.toggle('open');
}

// Filters
function applyFilters() {
  const text = document.getElementById('filter-text').value.toLowerCase();
  const confMin = parseFloat(document.getElementById('filter-conf').value);
  const source = document.getElementById('filter-source').value;
  const lowOnly = document.getElementById('filter-low-conf').checked;
  document.getElementById('conf-val').textContent = confMin.toFixed(2);

  document.querySelectorAll('.token-table tbody tr').forEach(tr => {
    const token = tr.children[1]?.textContent?.toLowerCase() || '';
    const isRegion = tr.dataset.region === 'true';
    const conf = parseFloat(tr.dataset.conf) || 0;
    let show = true;
    if (text && !token.includes(text)) show = false;
    if (lowOnly && (conf >= 0.7 || !isRegion)) show = false;
    tr.style.display = show ? '' : 'none';
  });

  document.querySelectorAll('.items-table tbody tr').forEach(tr => {
    const name = (tr.children[1]?.textContent || '').toLowerCase();
    const base = (tr.children[2]?.textContent || '').toLowerCase();
    const src = tr.querySelector('.badge-phon') ? 'phonetic' : 'det';
    let show = true;
    if (text && !name.includes(text) && !base.includes(text)) show = false;
    if (source && src !== source) show = false;
    tr.style.display = show ? '' : 'none';
  });
}

document.getElementById('filter-text').addEventListener('input', applyFilters);
document.getElementById('filter-conf').addEventListener('input', applyFilters);
document.getElementById('filter-source').addEventListener('change', applyFilters);
document.getElementById('filter-low-conf').addEventListener('change', applyFilters);

// Sort summary
let sortCol = 'id', sortAsc = true;
document.querySelectorAll('.summary th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    renderSummary();
  });
});

// Init
renderStats();
renderSummary();
renderConsultations();
</script>
</body>
</html>
