name: Publier l'image Docker

# Construit et publie l'image sur GitHub Container Registry (ghcr.io) à
# chaque push sur main, et sur chaque étiquette « v* » pour figer une version.
# C'est ce qui permet un déploiement à un seul fichier docker-compose.yml :
# personne d'autre n'a besoin de cloner le dépôt ni de construire l'image.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer QEMU (compilation croisée pour arm64)
        uses: docker/setup-qemu-action@v3

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # « latest » sur main, et en plus le numéro de version sur une étiquette
      # « vX.Y.Z » — utile pour épingler une version précise dans .env/compose.
      - name: Déterminer les étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Construire et publier (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
